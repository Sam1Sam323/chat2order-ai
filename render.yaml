services:
  - type: web
    name: chat2order-ai
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CHAT2ORDER_DB
        value: /opt/render/project/src/data/chat2order.db
      - key: CHAT2ORDER_SESSION_SECRET
        generateValue: true
      - key: CHAT2ORDER_USERNAME
        sync: false
      - key: CHAT2ORDER_PASSWORD
        sync: false
      - key: CHAT2ORDER_LINE_CHANNEL_SECRET
        sync: false
      - key: CHAT2ORDER_LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: CHAT2ORDER_LINE_STORE_ID
        sync: false
      - key: CHAT2ORDER_AI_API_KEY
        sync: false
      - key: CHAT2ORDER_AI_MODEL
        value: gpt-4o-mini
      - key: CHAT2ORDER_AI_BASE_URL
        value: https://api.openai.com/v1
    disk:
      name: chat2order-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
