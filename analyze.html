{% extends "base.html" %}
{% block content %}
<h2>💬 Tin nhắn → Đơn hàng AI</h2>
<p>Dán tin nhắn của khách hàng để hệ thống tự động nhận diện sản phẩm, màu sắc, kích thước và số lượng.</p>
<textarea id="message" rows="8" placeholder="Ví dụ: Áo màu đen, size L, 2 cái và áo màu trắng, size M, 1 cái"></textarea>
<br>
<button onclick="analyzeChat()">🤖 Phân tích tin nhắn</button>
<button class="secondary" onclick="saveOrder()">💾 Lưu đơn hàng</button>
<div id="result"></div>
<script>
let currentItems = [];
async function analyzeChat(){
 const message = document.getElementById('message').value;
 const res = await fetch('/api/analyze', {
   method:'POST', headers:{'Content-Type':'application/json'},
   body:JSON.stringify({message})
 });
 const data = await res.json();
 currentItems = data.items;
 const sourceLabel = data.source === 'ai' ? 'AI จริง' : 'Rule-based';
 let html = `<h3>🛒 Kết quả phân tích <small>(${sourceLabel})</small></h3>`;
 if(!data.items.length) html += '<p>Không tìm thấy sản phẩm.</p>';
 data.items.forEach((x,i)=>{
   html += `<div class="item"><b>${i+1}. ${x.product}</b><br>Màu: ${x.color} | Kích thước: ${x.size} | Số lượng: ${x.quantity}</div>`;
 });
 document.getElementById('result').innerHTML = html;
}
async function saveOrder(){
 const message = document.getElementById('message').value;
 if(!currentItems.length){ alert('Vui lòng phân tích tin nhắn trước.'); return; }
 const res = await fetch('/api/order', {
   method:'POST', headers:{'Content-Type':'application/json'},
   body:JSON.stringify({message, items:currentItems})
 });
 const data = await res.json();
 alert('Đã lưu đơn hàng #' + data.order_id + ' thành công.');
 location.href='/orders';
}
</script>
{% endblock %}
